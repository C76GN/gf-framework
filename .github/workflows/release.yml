name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release-artifacts:
    name: Build GF release artifacts once
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build release artifact set
        run: >
          python tools/build_gf_release_artifacts.py
          --version "${GITHUB_REF_NAME}"
          --output-dir build/release

      - name: Verify release metadata against built artifacts
        run: >
          python tools/gf_maintenance.py release-status
          --version "${GITHUB_REF_NAME}"
          --artifact-manifest "build/release/gf-release-artifacts-${GITHUB_REF_NAME}.json"

      - name: Upload immutable release artifact set
        uses: actions/upload-artifact@v7
        with:
          name: gf-release-${{ github.ref_name }}
          path: build/release
          if-no-files-found: error
          retention-days: 7

  release-framework-checks:
    name: GF release framework checks (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gut
            suite: framework-gut
            install_docs: false
            setup_godot: true
            timeout_minutes: 60
          - name: lsp
            suite: framework-lsp
            install_docs: false
            setup_godot: true
            timeout_minutes: 15
          - name: static
            suite: framework-static
            install_docs: true
            setup_godot: false
            timeout_minutes: 20
          - name: integration
            suite: framework-integration
            install_docs: false
            setup_godot: true
            timeout_minutes: 30

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        if: matrix.install_docs == true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Set up Godot
        if: matrix.setup_godot == true
        uses: ./.github/actions/setup-godot

      - name: Run release framework shard
        run: >
          python tools/gf_maintenance.py check
          --suite ${{ matrix.suite }}
          --failed-only
          --github-annotations

  create-release:
    name: Create GitHub Release
    permissions:
      contents: write
    needs:
      - build-release-artifacts
      - release-framework-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download verified release artifact set
        uses: actions/download-artifact@v8
        with:
          name: gf-release-${{ github.ref_name }}
          path: build/release

      - name: Verify downloaded release artifact set
        run: >
          python tools/build_gf_release_artifacts.py
          --version "${GITHUB_REF_NAME}"
          --manifest "build/release/gf-release-artifacts-${GITHUB_REF_NAME}.json"
          --validate-only

      - name: Extract release notes
        run: >
          python tools/extract_release_notes.py
          --tag "${GITHUB_REF_NAME}"
          --output "${RUNNER_TEMP}/release-notes.md"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/release/gf-framework-${GITHUB_REF_NAME}.zip" \
            "build/release/gf-ai-developer-kit-${GITHUB_REF_NAME}.zip" \
            "build/release/gf-release-artifacts-${GITHUB_REF_NAME}.json" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
