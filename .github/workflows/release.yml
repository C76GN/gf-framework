name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-framework-checks:
    name: GF release framework checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Set up Godot
        uses: ./.github/actions/setup-godot

      - name: Run release metadata and framework shard
        run: |
          python tools/gf_maintenance.py release-status --version "${GITHUB_REF_NAME}"
          python tools/gf_maintenance.py check --suite framework --failed-only --github-annotations

  release-package-checks:
    name: GF release package checks (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contract
            suite: package-contract
            timeout_minutes: 30
          - name: editor
            suite: package-editor
            timeout_minutes: 30
          - name: cli
            suite: package-cli
            timeout_minutes: 45
          - name: godot-matrix
            suite: package-godot-release
            timeout_minutes: 30

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Godot
        uses: ./.github/actions/setup-godot

      - name: Run release package shard
        run: >
          python tools/gf_maintenance.py check
          --suite ${{ matrix.suite }}
          --failed-only
          --github-annotations

  create-release:
    name: Create GitHub Release
    needs:
      - release-framework-checks
      - release-package-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract release notes
        run: >
          python tools/extract_release_notes.py
          --tag "${GITHUB_REF_NAME}"
          --output "${RUNNER_TEMP}/release-notes.md"

      - name: Build Asset Store package
        run: >
          python tools/build_asset_store_package.py
          --version "${GITHUB_REF_NAME}"
          --output "build/gf-framework-${GITHUB_REF_NAME}.zip"

      - name: Build modular package registry
        run: |
          python tools/build_gf_package.py \
            --all \
            --version "${GITHUB_REF_NAME}" \
            --output-dir "build/packages" \
            --registry "build/gf-registry-${GITHUB_REF_NAME}.json" \
            --archive-base-url "https://github.com/C76GN/gf-framework/releases/download/${GITHUB_REF_NAME}" \
            --registry-source "build/gf-registry-source.json" \
            --registry-source-registry-url "https://github.com/C76GN/gf-framework/releases/download/${GITHUB_REF_NAME}/gf-registry-${GITHUB_REF_NAME}.json" \
            --json
          python tools/build_gf_package.py \
            --all \
            --version "${GITHUB_REF_NAME}" \
            --output-dir "build/offline-bundle/packages" \
            --registry "build/offline-bundle/registry/index.json" \
            --registry-source "build/offline-bundle/registry/gf-registry-source.json" \
            --offline-bundle "build/gf-package-offline-bundle-${GITHUB_REF_NAME}.zip" \
            --json

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/gf-framework-${GITHUB_REF_NAME}.zip" \
            "build/gf-registry-${GITHUB_REF_NAME}.json" \
            "build/gf-registry-source.json" \
            "build/gf-package-offline-bundle-${GITHUB_REF_NAME}.zip" \
            build/packages/*.zip \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
