name: Inspect Action Queue LSP on Linux

on:
  pull_request:
    types: [synchronize]
    paths: [".github/workflows/ui-motion-lsp-investigation.yml"]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'feat/composable-ui-motion'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scenario: [groups, early, late, scene, recipe, trace]
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-godot
      - name: Prepare disposable project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          scenario = os.environ["SCENARIO"]
          if scenario in {"scene", "recipe"}:
              path = Path("tests/gf_core/extensions/action_queue/fixtures/route_illumination.tscn")
              identifier = "view" if scenario == "scene" else "recipe"
              lines = path.read_text().splitlines(keepends=True)
              keep = [s for s in lines if f'id="{identifier}"]' not in s and f'= ExtResource("{identifier}")' not in s]
              assert len(keep) == len(lines)-2
              path.write_text("".join(keep))
          if scenario == "trace":
              path = Path("tools/gdscript_lsp_diagnostics.py")
              code = path.read_text()
              needle = 'str(port),\n\t\t"--log-file",'
              assert code.count(needle) == 1
              path.write_text(code.replace(needle, 'str(port),\n\t\t"--verbose",\n\t\t"--log-file",'))
          PY
          godot --headless --path . --editor --import --quit > "$RUNNER_TEMP/import.log" 2>&1
      - name: Compare normal editor scans
        shell: bash
        run: |
          set -euo pipefail
          folder=tests/gf_core/extensions/action_queue
          tests=()
          for path in "$folder"/test_*.gd; do tests+=(--file "$path"); done
          scan() {
            label="$1"
            shift
            result=0
            python tools/gdscript_lsp_diagnostics.py --spawn-lsp --port 0 \
              --startup-timeout 120 --lsp-process-timeout 600 --request-timeout 120 \
              --per-file-timeout 3 --max-file-timeout 12 --timeout-retries 2 \
              --fail-severity error,warning --log-file "$RUNNER_TEMP/$label.log" --keep-log \
              "$@" > "$RUNNER_TEMP/$label.out" 2>&1 || result=$?
            echo "Inspection case $SCENARIO/$label exit=$result"
            sed -n '/Last GDScript open request\|files_scanned=\|unavailable before\|^.*\.gd:[0-9]/p' "$RUNNER_TEMP/$label.out" | head -18
            printf '%s\n' "- $label exit=$result" >> "$GITHUB_STEP_SUMMARY"
          }
          with_fixture() { scan "$1" --file "$folder/fixtures/$1.gd" "${tests[@]}"; }
          case "$SCENARIO" in
            groups)
              scan tests_without_fixtures "${tests[@]}"
              scan fixtures_only --include "$folder/fixtures"
              scan without_view --include "$folder" --exclude-prefix "$folder/fixtures/route_illumination_view.gd"
              ;;
            early)
              for fixture in cancel_during_sample decode_label live_meter material_pack_probe recorded_live_effect; do with_fixture "$fixture"; done
              ;;
            late)
              for fixture in route_illumination route_illumination_playback route_illumination_view; do with_fixture "$fixture"; done
              ;;
            scene|recipe) scan queue --include "$folder" ;;
            trace)
              scan queue --include "$folder"
              grep -Ei 'loading resource|Last GDScript|crash|resource loader' "$RUNNER_TEMP/queue.log" | tail -55 || true
              ;;
          esac
