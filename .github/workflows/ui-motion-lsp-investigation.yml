name: Inspect Action Queue LSP on Linux

on:
  pull_request:
    types: [synchronize]
    paths: [".github/workflows/ui-motion-lsp-investigation.yml"]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'feat/composable-ui-motion'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scenario: [control, blank, draw, points, runtime_load, plain_playback, export, child]
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-godot
      - name: Prepare disposable project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          scenario = os.environ["SCENARIO"]
          folder = Path("tests/gf_core/extensions/action_queue/fixtures")
          view = folder / "route_illumination_view.gd"
          playback = folder / "route_illumination_playback.gd"
          scene = folder / "route_illumination.tscn"
          code = view.read_text()
          def replace(old, new):
              global code
              assert code.count(old) == 1, old
              code = code.replace(old, new)
          if scenario == "blank":
              code = "extends Node2D\n\n@export var recipe: Resource\n"
          elif scenario == "draw":
              code = code[:code.index("\n\nfunc _draw()")] + "\n"
          elif scenario == "points":
              replace("const POINTS: Array[Vector2]", "const POINTS")
          elif scenario == "plain_playback":
              playback.write_text(playback.read_text().removeprefix("@tool\n\n"))
          elif scenario == "export":
              replace("@export var recipe", "var recipe")
          elif scenario in {"runtime_load", "child"}:
              script_path = "res://tests/gf_core/extensions/action_queue/fixtures/route_illumination_playback.gd"
              replace(f'const _PLAYBACK = preload("{script_path}")\n', "")
              replace("var _playback: _PLAYBACK", "var _playback: GFUIMotionPlayer")
              if scenario == "child":
                  resource = f'[ext_resource type="Script" path="{script_path}" id="playback"]'
                  node = '[node name="Playback" type="Node" parent="."]\nscript = ExtResource("playback")\n'
                  scene.write_text(scene.read_text().replace('[node name="RouteIllumination"', resource + '\n\n[node name="RouteIllumination"') + '\n' + node)
                  replace("_playback = _PLAYBACK.new()\n\tadd_child(_playback)", "_playback = $Playback")
              else:
                  replace("_playback = _PLAYBACK.new()", f'_playback = load("{script_path}").new()')
              replace("_playback.start_routes(\n", '_playback.call(\n\t\t&"start_routes",\n')
              replace("_playback.sample_seconds(seconds)", '_playback.call(&"sample_seconds", seconds)')
          view.write_text(code)
          PY
          godot --headless --path . --editor --import --quit > "$RUNNER_TEMP/import.log" 2>&1
      - name: Compare normal editor scans
        shell: bash
        run: |
          set -euo pipefail
          folder=tests/gf_core/extensions/action_queue
          scan() {
            label="$1"
            shift
            result=0
            python tools/gdscript_lsp_diagnostics.py --spawn-lsp --port 0 \
              --startup-timeout 120 --lsp-process-timeout 600 --request-timeout 120 \
              --per-file-timeout 3 --max-file-timeout 12 --timeout-retries 2 \
              --fail-severity error,warning --log-file "$RUNNER_TEMP/$label.log" --keep-log \
              "$@" > "$RUNNER_TEMP/$label.out" 2>&1 || result=$?
            echo "Inspection case $SCENARIO/$label exit=$result"
            sed -n '/Last GDScript open request\|files_scanned=\|unavailable before\|^.*\.gd:[0-9]/p' "$RUNNER_TEMP/$label.out" | head -18
            printf '%s\n' "- $label exit=$result" >> "$GITHUB_STEP_SUMMARY"
          }
          scan queue --include "$folder"
