site_name: GF Framework
site_description: Godot 4 lightweight game architecture framework.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://gf-framework.readthedocs.io/"]
repo_url: https://github.com/C76GN/gf-framework
repo_name: C76GN/gf-framework
docs_dir: docs/zh
site_dir: site
not_in_nav: |
  reference/api/classes/*.md
  overview/**/*.md
  kernel/**/*.md
  standard/**/*.md
  extensions/**/*.md
  editor/*.md
  editor/tools/config-pipeline.md

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 首页: index.md
  - FAQ: faq.md
  - 入门:
      - 总览: overview/index.md
      - 快速开始: overview/quickstart/index.md
      - 项目实践建议: overview/best-practices/index.md
  - Kernel:
      - 总览: kernel/index.md
      - 架构容器: kernel/architecture/index.md
      - 生命周期、装配与依赖: kernel/lifecycle/index.md
      - 消息、事件、命令与查询: kernel/messaging/index.md
      - 场景桥接、Controller 与数据绑定: kernel/scene-controller/index.md
  - Standard:
      - 标准库总览: standard/index.md
      - Foundation 基础能力:
          - 总览: standard/foundation/index.md
          - 数值、成长与权重: standard/foundation/scalars/index.md
          - 网格、路径与空间数据: standard/foundation/grid-spatial/index.md
          - 数据结构、校验与集合: standard/foundation/data-validation/index.md
      - Utilities:
          - 总览: standard/utilities/index.md
          - 资源、存储与 IO: standard/utilities/io/index.md
          - 运行时服务与调试: standard/utilities/runtime/index.md
      - 输入、流程与玩法支撑: standard/input-flow/index.md
  - Extensions:
      - 扩展总览与规范: extensions/index.md
      - Manifest 规范: extensions/manifest/index.md
      - Capability: extensions/capability/index.md
      - Interaction: extensions/interaction/index.md
      - Feedback: extensions/feedback/index.md
      - Camera: extensions/camera/index.md
      - Dialogue: extensions/dialogue/index.md
      - Combat: extensions/combat/index.md
      - ActionQueue: extensions/action-queue/index.md
      - Asset Metadata: extensions/asset-metadata/index.md
      - Network 与 TurnBased: extensions/network-turnbased/index.md
      - Flow: extensions/flow/index.md
      - BehaviorTree: extensions/behavior-tree/index.md
      - Decision: extensions/decision/index.md
      - Content Package: extensions/content-package/index.md
      - Domain: extensions/domain/index.md
      - Physics: extensions/physics/index.md
      - Save 场景存档图: extensions/save-graph/index.md
  - Editor:
      - 总览: editor/index.md
      - ProjectSettings: editor/project-settings.md
      - GF Workspace: editor/workspace.md
      - 菜单与脚本模板: editor/menus-templates.md
      - 编辑器命令、上下文与工具协议: editor/tool-protocols.md
      - 访问器生成: editor/access-generator.md
      - Inspector、工作区页面与导出插件: editor/editor-extensions.md
      - 通用 Resource 表格控件: editor/resource-table-editor.md
      - 工具包:
          - 总览: editor/tools/index.md
  - Reference:
      - 参考资料: reference/index.md
      - API Reference:
          - 总览: reference/api/index.md
          - Kernel: reference/api/kernel.md
          - Standard: reference/api/standard.md
          - Tool Packages API: reference/api/tools.md
          - Extensions:
              - Action Queue: reference/api/extensions-action-queue.md
              - Asset Metadata: reference/api/extensions-asset-metadata.md
              - Behavior Tree: reference/api/extensions-behavior-tree.md
              - Camera: reference/api/extensions-camera.md
              - Capability: reference/api/extensions-capability.md
              - Combat: reference/api/extensions-combat.md
              - Content Package: reference/api/extensions-content-package.md
              - Decision: reference/api/extensions-decision.md
              - Dialogue: reference/api/extensions-dialogue.md
              - Domain: reference/api/extensions-domain.md
              - Feedback: reference/api/extensions-feedback.md
              - Flow: reference/api/extensions-flow.md
              - Interaction: reference/api/extensions-interaction.md
              - Network: reference/api/extensions-network.md
              - Physics: reference/api/extensions-physics.md
              - Save: reference/api/extensions-save.md
              - Turn Based: reference/api/extensions-turn-based.md
      - 更新日志: changelog.md
